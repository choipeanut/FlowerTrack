<!--
  실행 방법:
  1. 이 파일(index.html)과 flower.mp4를 같은 폴더에 놓으세요
  2. 터미널에서 해당 폴더로 이동 후:
     python -m http.server 8080
  3. 브라우저에서 http://localhost:8080 접속
  4. 웹캠 권한 허용 후 손을 화면에 보여주세요
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌷 손으로 꽃을 피워보세요</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Georgia, serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #title {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.6rem;
      font-weight: normal;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.88);
      text-shadow: 0 0 18px rgba(200, 60, 40, 0.55), 0 2px 8px rgba(0,0,0,0.7);
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }

    #videoWrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #flowerVideo {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    /* 웹캠 미리보기 영역 */
    #camWrap {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 200px;
      height: 150px;
      border-radius: 8px;
      overflow: hidden;
      border: 1.5px solid rgba(255,255,255,0.25);
      background: #111;
      z-index: 20;
    }

    #camCanvas {
      width: 200px;
      height: 150px;
      display: block;
      transform: scaleX(-1); /* 미러 효과 */
    }

    /* 개방도 게이지 영역 */
    #gaugeWrap {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      z-index: 20;
    }

    #gaugeLabel {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.03em;
    }

    #gaugeBarWrap {
      width: 180px;
      height: 14px;
      background: rgba(255,255,255,0.12);
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }

    #gaugeBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7a0a00, #cc2200, #ff6644);
      border-radius: 7px;
      transition: none;
    }

    #gaugePercent {
      font-size: 0.85rem;
      color: rgba(255, 120, 80, 0.9);
      font-family: monospace;
      min-width: 40px;
      text-align: right;
    }

    #noHandMsg {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.55);
      font-family: Georgia, serif;
      margin-top: 4px;
      min-height: 1.2em;
      text-align: right;
      letter-spacing: 0.02em;
    }

    /* 숨겨진 웹캠 비디오 (처리용) */
    #webcamVideo {
      display: none;
    }
  </style>
</head>
<body>

  <div id="title">🌷 손으로 꽃을 피워보세요</div>

  <div id="videoWrap">
    <video
      id="flowerVideo"
      src="flower.mp4"
      preload="auto"
      muted
      playsinline
    ></video>
  </div>

  <div id="camWrap">
    <canvas id="camCanvas" width="200" height="150"></canvas>
  </div>

  <div id="gaugeWrap">
    <div id="gaugeLabel">손 개방도</div>
    <div id="gaugeBarWrap">
      <div id="gaugeBar"></div>
    </div>
    <div id="gaugePercent">0%</div>
    <div id="noHandMsg">✋ 화면에 손을 보여주세요</div>
  </div>

  <video id="webcamVideo" autoplay playsinline muted></video>

  <!-- MediaPipe CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <script>
    // ─── 요소 참조 ────────────────────────────────────────────────────
    const video       = document.getElementById('flowerVideo');
    const webcamVideo = document.getElementById('webcamVideo');
    const camCanvas   = document.getElementById('camCanvas');
    const ctx         = camCanvas.getContext('2d');
    const gaugeBar    = document.getElementById('gaugeBar');
    const gaugePercent= document.getElementById('gaugePercent');
    const noHandMsg   = document.getElementById('noHandMsg');

    // ─── 상태 변수 ────────────────────────────────────────────────────
    const ALPHA        = 0.12;   // EMA 스무딩 계수
    const LERP_TIME    = 0.10;   // currentTime lerp 계수
    const DECAY_RATE   = 0.95;   // NO_HAND 상태 감쇠 비율

    let smoothedOpenness  = 0;
    let currentDisplayTime = 0;
    let handState = 'NO_HAND';   // 'NO_HAND' | 'TRACKING'
    let latestLandmarks = null;

    // ─── 비디오 초기화 ────────────────────────────────────────────────
    video.addEventListener('loadedmetadata', () => {
      video.currentTime = 0;
    });
    // seeked 이벤트로 인한 프레임 갱신 지연을 최소화하기 위해 muted 유지
    video.pause();

    // ─── 유틸: 두 랜드마크 사이 거리 ─────────────────────────────────
    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dz = (a.z || 0) - (b.z || 0);
      return Math.sqrt(dx*dx + dy*dy + dz*dz);
    }

    // ─── 손 개방도 계산 ───────────────────────────────────────────────
    function calcOpenness(landmarks) {
      // 손가락 4개 (검지~소지): [MCP, PIP, DIP, TIP]
      const fingers = [
        [5,  6,  7,  8 ],  // 검지
        [9,  10, 11, 12],  // 중지
        [13, 14, 15, 16],  // 약지
        [17, 18, 19, 20],  // 소지
      ];

      const wrist = landmarks[0];
      let extendedCount = 0;

      for (const [mcp, pip, , tip] of fingers) {
        const distTip = dist(landmarks[tip], wrist);
        const distPip = dist(landmarks[pip], wrist);
        if (distTip > distPip * 1.1) extendedCount++;
      }

      // 엄지: tip과 mcp 사이 가로 간격
      const thumbTip = landmarks[4];
      const thumbMcp = landmarks[2];
      if (Math.abs(thumbTip.x - thumbMcp.x) > 0.05) extendedCount++;

      return extendedCount / 5; // 0.0 ~ 1.0
    }

    // ─── 웹캠 캔버스에 랜드마크 그리기 ──────────────────────────────
    function drawCamFrame(landmarks) {
      // 웹캠 영상 그리기 (미러 없이 — CSS에서 scaleX(-1) 적용)
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(webcamVideo, -200, 0, 200, 150);
      ctx.restore();

      if (!landmarks) return;

      // 랜드마크 점 + 연결선
      const W = 200, H = 150;

      // 연결선 (손 뼈대)
      const connections = window.HAND_CONNECTIONS || [
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [5,9],[9,10],[10,11],[11,12],
        [9,13],[13,14],[14,15],[15,16],
        [13,17],[17,18],[18,19],[19,20],
        [0,17]
      ];

      ctx.strokeStyle = 'rgba(0, 200, 80, 0.65)';
      ctx.lineWidth = 1.2;
      for (const [a, b] of connections) {
        const lA = landmarks[a];
        const lB = landmarks[b];
        // 미러된 좌표 (CSS scaleX(-1) 보상)
        const ax = (1 - lA.x) * W;
        const ay = lA.y * H;
        const bx = (1 - lB.x) * W;
        const by = lB.y * H;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.stroke();
      }

      // 랜드마크 점
      for (const lm of landmarks) {
        const x = (1 - lm.x) * W;
        const y = lm.y * H;
        ctx.beginPath();
        ctx.arc(x, y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = '#00ff88';
        ctx.fill();
      }
    }

    // ─── MediaPipe Hands 설정 ─────────────────────────────────────────
    const hands = new Hands({
      locateFile: (file) =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.6,
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        latestLandmarks = results.multiHandLandmarks[0];
        handState = 'TRACKING';
      } else {
        latestLandmarks = null;
        handState = 'NO_HAND';
      }
    });

    // ─── 웹캠 스트림 초기화 ───────────────────────────────────────────
    const camera = new Camera(webcamVideo, {
      onFrame: async () => {
        await hands.send({ image: webcamVideo });
      },
      width: 320,
      height: 240,
    });
    camera.start();

    // ─── 메인 애니메이션 루프 ─────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);

      // 1) 손 개방도 계산 및 EMA 스무딩
      if (handState === 'TRACKING' && latestLandmarks) {
        const rawOpenness = calcOpenness(latestLandmarks);
        smoothedOpenness += (rawOpenness - smoothedOpenness) * ALPHA;
      } else {
        // NO_HAND: 서서히 봉오리로
        smoothedOpenness *= DECAY_RATE;
        if (smoothedOpenness < 0.001) smoothedOpenness = 0;
      }

      // 2) currentTime lerp
      const dur = video.duration || 1;
      const targetTime = smoothedOpenness * dur;
      currentDisplayTime += (targetTime - currentDisplayTime) * LERP_TIME;

      // fastSeek 지원 브라우저는 fastSeek 사용 (더 부드러움)
      const t = Math.max(0, Math.min(dur, currentDisplayTime));
      try {
        if (typeof video.fastSeek === 'function') {
          video.fastSeek(t);
        } else {
          video.currentTime = t;
        }
      } catch (e) {
        // seeked 중 발생할 수 있는 DOMException 무시
      }

      // 3) 웹캠 캔버스 업데이트
      drawCamFrame(latestLandmarks);

      // 4) 게이지 UI 업데이트
      const pct = Math.round(smoothedOpenness * 100);
      gaugeBar.style.width = pct + '%';
      gaugePercent.textContent = pct + '%';

      // 5) 상태 메시지
      if (handState === 'NO_HAND') {
        noHandMsg.textContent = '✋ 화면에 손을 보여주세요';
      } else {
        noHandMsg.textContent = '';
      }
    }

    animate();
  </script>
</body>
</html>
